schema_id: toll-invoice
name: 通行费
extends: standard-invoice
special_invoice_type_value: 通行费

match_rules:
  required_all:
    - 通行费
    - 站入
    - 站出

fields:
  toll_variant:
    required: true
  vehicle_plate_no:
    required: true
  toll_entrance:
    required: true
  toll_exit:
    required: true
  passage_time:
    required: true

item_context_patterns:
  toll_variant:
    patterns:
      - pattern: '\d+(?:\.\d+)?%'
        value: 征税
      - pattern: '不征税'
        value: 不征税通行费
  vehicle_plate_no:
    patterns:
      - '(?:车牌号码|车牌号)[：:]?\s*([\u4e00-\u9fff][A-Z][A-Z0-9]{5,6})'
      - '([\u4e00-\u9fff][A-Z][A-Z0-9]{5,6})\s+.+?站入'
  toll_entrance:
    patterns:
      - '(?:入口站?|驶入站)[：:]?\s*([^\s]+)'
      - '[\u4e00-\u9fff][A-Z][A-Z0-9]{5,6}\s+(.+?站)入'
  toll_exit:
    patterns:
      - '(?:出口站?|驶出站)[：:]?\s*([^\s]+)'
      - '站入\s+(.+?站)出'
  passage_time:
    patterns:
      - '(?:通行时间|通行日期)[：:]?\s*(\d{4}(?:年\d{1,2}月\d{1,2}日?|[-/]\d{1,2}[-/]\d{1,2})(?:\s+\d{1,2}:\d{2}(?::\d{2})?)?)'
      - '站出\s+(\d{4}-\d{1,2}-\d{1,2}\s+\d{1,2}:\d{2}:\d{2})'

unverified_variants:
  - 不征税通行费

unverified_variant_rules:
  不征税通行费:
    required_all:
      - ETC
      - 充值
      - 不征税
